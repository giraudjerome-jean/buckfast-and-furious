name: Update archive

on:
  schedule:
    - cron: "0 * * * *" # toutes les heures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch RSS and update archive
        run: |
          curl --fail --silent --show-error --retry 3 \
            "https://api.rss2json.com/v1/api.json?rss_url=https://www.google.com/alerts/feeds/02891315752029914665/15910925906449957310" \
            > feed.json
          node scripts/update-archive.js feed.json archive.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add archive.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update archive"
          git push
