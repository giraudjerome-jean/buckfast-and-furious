name: Update archive
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch, filter and update archive
        run: |
          curl --fail --silent --show-error --retry 3 "https://api.rss2json.com/v1/api.json?rss_url=https://www.google.com/alerts/feeds/02891315752029914665/15910925906449957310" > feed.json
          node <<'EOF'
          const fs=require('fs');
          const feed=JSON.parse(fs.readFileSync('feed.json','utf8'));
          const archive=fs.existsSync('archive.json')?JSON.parse(fs.readFileSync('archive.json','utf8')):[];
          const text=v=>String(v||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
          const count=s=>(s.match(/\bbuckfast\b/gi)||[]).length;
          const keep=item=>{
            const title=text(item.title), desc=text(item.description), all=title+' '+desc;
            if(!count(all)||/\bbuckfastleigh\b/i.test(all)||/\bbuckfast\s+(road|street|avenue|lane|way|drive|close|court|place|terrace|gardens)\b/i.test(all)||/\b(personalised|personalized|custom|sticker|label|foil|burner|liner|coupon|promo code|free shipping|pack of|\d+\s?(pcs|pc|pack|set))\b/i.test(all)) return false;
            return count(title)>0 || (count(all)>=2 && /\b(tonic wine|fortified wine|caffeinated wine|wine|alcohol|drink|drinking|booze|bottle|buckie|bucky)\b/i.test(all));
          };
          const links=new Set(archive.map(x=>x.link));
          const add=(feed.items||[]).filter(x=>x&&x.link&&!links.has(x.link)&&keep(x));
          fs.writeFileSync('archive.json',JSON.stringify([...add,...archive],null,2)+'\n');
          EOF
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add archive.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update archive"
          git push
