name: Update archive

on:
  schedule:
    - cron: '0 * * * *' # toutes les heures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch RSS and update archive
        run: |
          mkdir -p feeds
          urls=(
            "https://www.google.com/alerts/feeds/02891315752029914665/15910925906449957310"
            "https://www.google.com/alerts/feeds/02891315752029914665/4370149902045499391"
            "https://www.google.com/alerts/feeds/02891315752029914665/11146652638055505935"
            "https://news.google.com/rss/search?q=buckfast&hl=en-GB&gl=GB&ceid=GB:en"
            "https://news.google.com/rss/search?q=buckfast%20crime&hl=en-GB&gl=GB&ceid=GB:en"
            "https://news.google.com/rss/search?q=buckfast%20assault%20OR%20buckfast%20attack%20OR%20buckfast%20arrest&hl=en-GB&gl=GB&ceid=GB:en"
          )

          for i in "${!urls[@]}"; do
            encoded=$(node -p 'encodeURIComponent(process.argv[1])' "${urls[$i]}")
            curl --fail --silent --show-error --retry 3 \
              "https://api.rss2json.com/v1/api.json?rss_url=$encoded" \
              > "feeds/$i.json" || echo '{"items":[]}' > "feeds/$i.json"
          done

          node - <<'NODE'
          const fs = require("fs");
          const items = fs.readdirSync("feeds")
            .sort()
            .flatMap(file => JSON.parse(fs.readFileSync(`feeds/${file}`, "utf8")).items || []);
          fs.writeFileSync("feed.json", JSON.stringify({ items }, null, 2));
          NODE

          node scripts/update-archive.js feed.json archive.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add archive.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update archive"
          git push
