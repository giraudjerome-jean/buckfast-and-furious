name: Update archive

on:
  schedule:
    - cron: '0 * * * *' # toutes les heures
  push:
    branches: [main] # republie le site après une modification manuelle
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch RSS and update archive
        run: |
          mkdir -p feeds
          urls=(
            "https://www.google.com/alerts/feeds/02891315752029914665/15910925906449957310"
            "https://www.google.com/alerts/feeds/02891315752029914665/4370149902045499391"
            "https://www.google.com/alerts/feeds/02891315752029914665/11146652638055505935"
            "https://news.google.com/rss/search?q=buckfast&hl=en-GB&gl=GB&ceid=GB:en"
            "https://news.google.com/rss/search?q=buckfast%20crime&hl=en-GB&gl=GB&ceid=GB:en"
            "https://news.google.com/rss/search?q=buckfast%20assault%20OR%20buckfast%20attack%20OR%20buckfast%20arrest&hl=en-GB&gl=GB&ceid=GB:en"
          )

          for i in "${!urls[@]}"; do
            encoded=$(node -p 'encodeURIComponent(process.argv[1])' "${urls[$i]}")
            curl --fail --silent --show-error --retry 3 \
              "https://api.rss2json.com/v1/api.json?rss_url=$encoded" \
              > "feeds/$i.json" || echo '{"items":[]}' > "feeds/$i.json"
          done

          node - <<'NODE'
          const fs = require("fs");
          const items = fs.readdirSync("feeds")
            .sort()
            .flatMap(file => JSON.parse(fs.readFileSync(`feeds/${file}`, "utf8")).items || []);
          fs.writeFileSync("feed.json", JSON.stringify({ items }, null, 2));
          NODE

          node scripts/update-archive.js feed.json archive.json

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add archive.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update archive"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Builds the static pages (home with articles, one page per incident,
  # sitemap.xml, robots.txt) and publishes them on GitHub Pages.
  deploy:
    needs: update
    if: ${{ !cancelled() && needs.update.result != 'failure' && (github.event_name != 'schedule' || needs.update.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main # inclut l'archive que le job précédent vient de pousser

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, test and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
