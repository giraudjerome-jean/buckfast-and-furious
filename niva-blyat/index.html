<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101217">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NIVA BLYAT — FLAPPY DOOMER BUILD</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d0f13;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{height:100%;display:grid;place-items:center;background:#0d0f13}
canvas{display:block;width:100vw;height:100vh;object-fit:contain;background:#aebdcc;touch-action:none}
#rotate{display:none;position:fixed;inset:0;z-index:10;background:#0d0f13;color:#fff;place-items:center;text-align:center;padding:30px;font-weight:900;letter-spacing:.04em}
#rotate b{display:block;color:#ef3d32;font-size:28px;margin-bottom:12px}
@media (orientation:portrait) and (max-width:900px){#rotate{display:grid}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="rotate"><div><b>NIVA BLYAT</b>Tourne ton téléphone en paysage<br><small>puis tape l’écran.</small></div></div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');
var W=960,H=540,GROUND=438,CAR_X=250;
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};
var rand=function(a,b){return a+Math.random()*(b-a);};
var pick=function(a){return a[(Math.random()*a.length)|0];};
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:(+v||0);}catch(e){return d;}},set:function(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}};

var state='title',last=0,elapsed=0,distance=0,best=store.get('nivaFlappyBest',0),score=0,bestScore=store.get('nivaFlappyScore',0);
var speed=215,spawnTimer=0,obstacles=[],particles=[],shake=0,flash=0,deathText='',zone=0,zoneFlash=0;
var car={y:GROUND-46,vy:0,pitch:0,impact:0,hat:true,shoe:true,spin:0};
var audio=null,nextBeat=0,beat=0,bpm=154;
var startedHint=0;

window.addEventListener('error',function(ev){try{ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='700 24px monospace';ctx.fillText('NIVA BLYAT — JS ERROR',36,60);ctx.font='16px monospace';ctx.fillText(String(ev.message||'unknown').slice(0,100),36,96);}catch(e){}});

function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function text(t,x,y,s,c,align){ctx.font='900 '+s+'px ui-monospace,monospace';ctx.textAlign=align||'left';ctx.textBaseline='top';ctx.lineWidth=Math.max(2,s*.085);ctx.strokeStyle='#111';ctx.strokeText(t,x,y);ctx.fillStyle=c||'#fff';ctx.fillText(t,x,y);}
function haptic(v){try{if(navigator.vibrate)navigator.vibrate(v);}catch(e){}}

function ensureAudio(){
  if(audio)return;
  var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  var ac=new AC(),master=ac.createGain();master.gain.value=.16;master.connect(ac.destination);
  audio={ac:ac,master:master};nextBeat=ac.currentTime+.03;
}
function tone(freq,dur,vol,type,when){
  if(!audio)return;var ac=audio.ac,o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(when||0);
  o.type=type||'square';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(audio.master);o.start(t);o.stop(t+dur+.02);
}
function kick(){
  if(!audio)return;var ac=audio.ac,o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type='sine';o.frequency.setValueAtTime(145,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(audio.master);o.start(t);o.stop(t+.15);
}
function tickAudio(){
  if(!audio||state!=='play')return;var ac=audio.ac,bd=60/bpm;
  while(nextBeat<=ac.currentTime+.02){kick();if(beat%2)tone(300,.035,.08,'square');if(score>=5)tone(55,.14,.14,'sawtooth');if(score>=12&&beat%2===0)tone(110,.08,.06,'square');beat++;nextBeat+=bd;}
}

function burst(x,y,n,c,scale){
  scale=scale||1;for(var i=0;i<n;i++)particles.push({x:x,y:y,vx:rand(-180,180)*scale,vy:rand(-220,-50)*scale,life:rand(.35,.9),max:1,c:c,s:rand(2,7)});
}
function updateParticles(dt){
  for(var i=0;i<particles.length;i++){var p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;}
  particles=particles.filter(function(p){return p.life>0;});
}

function reset(){
  state='play';elapsed=0;distance=0;score=0;speed=215;spawnTimer=1.25;obstacles=[];particles=[];shake=0;flash=0;deathText='';zone=0;zoneFlash=1.6;startedHint=2.2;
  car.y=GROUND-46;car.vy=0;car.pitch=0;car.impact=0;car.hat=true;car.shoe=true;car.spin=0;
  if(audio){beat=0;nextBeat=audio.ac.currentTime+.05;}
  spawnObstacle(860,'pothole');
}

function obstacleGap(){
  var minGap=score<8?170:score<18?154:140;
  var center=rand(245,350);
  return {top:center-minGap/2,bottom:center+minGap/2};
}
function spawnObstacle(x,forced){
  var pool=score<4?['pothole','truck','pipe']:score<10?['pothole','truck','pipe','gate']:['pothole','truck','pipe','gate','double'];
  var type=forced||pick(pool),o={type:type,x:x==null?W+120:x,passed:false,hit:false};
  if(type==='pothole'){o.w=score<3?88:118;o.y=GROUND-5;o.h=34;}
  if(type==='truck'){o.w=110;o.y=GROUND-92;o.h=92;}
  if(type==='pipe'){o.w=105;o.y=0;o.h=285+rand(-20,25);}
  if(type==='gate'){var g=obstacleGap();o.w=88;o.gTop=g.top;o.gBottom=g.bottom;}
  if(type==='double'){var g2=obstacleGap();o.w=126;o.gTop=g2.top;o.gBottom=g2.bottom;o.offset=82;}
  obstacles.push(o);
}

function tap(){
  ensureAudio();if(audio&&audio.ac.state==='suspended')audio.ac.resume();
  if(state==='title'||state==='gameover'){reset();haptic(10);return;}
  if(state!=='play')return;
  car.vy=Math.max(car.vy-350,-640);car.pitch=-.16;car.impact=.16;startedHint=0;
  tone(240,.035,.1,'square');haptic(8);
  burst(CAR_X-76,car.y+30,4,'#d9dde0',.35);
}

function carBox(){return {x:CAR_X-76,y:car.y-35,w:152,h:72};}
function intersects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function collides(o){
  var b=carBox();
  if(o.type==='pothole'){
    var zone={x:o.x-o.w/2,y:GROUND-18,w:o.w,h:50};
    return intersects(b,zone)&&car.y>GROUND-82;
  }
  if(o.type==='truck')return intersects(b,{x:o.x-o.w/2,y:o.y,w:o.w,h:o.h});
  if(o.type==='pipe')return intersects(b,{x:o.x-o.w/2,y:0,w:o.w,h:o.h});
  if(o.type==='gate'){
    var x=o.x-o.w/2;return intersects(b,{x:x,y:0,w:o.w,h:o.gTop})||intersects(b,{x:x,y:o.gBottom,w:o.w,h:GROUND-o.gBottom+20});
  }
  if(o.type==='double'){
    var x1=o.x-o.w/2,x2=x1+o.offset;
    var a1=intersects(b,{x:x1,y:0,w:44,h:o.gTop})||intersects(b,{x:x1,y:o.gBottom,w:44,h:GROUND-o.gBottom+20});
    var shift=Math.sin(o.x*.01)*32;
    var gt=clamp(o.gTop+shift,120,310),gb=clamp(o.gBottom+shift,250,405);
    var a2=intersects(b,{x:x2,y:0,w:44,h:gt})||intersects(b,{x:x2,y:gb,w:44,h:GROUND-gb+20});
    return a1||a2;
  }
  return false;
}

function die(o){
  if(state!=='play')return;state='gameover';shake=.8;flash=.2;car.spin=rand(-3.5,3.5);car.vy=-280;burst(CAR_X,car.y,24,'#d1d4d5',1);burst(CAR_X,car.y+20,12,'#ef3d32',.6);
  tone(58,.32,.34,'sawtooth');haptic([60,30,80]);
  best=Math.max(best,Math.floor(distance));bestScore=Math.max(bestScore,score);store.set('nivaFlappyBest',best);store.set('nivaFlappyScore',bestScore);
  deathText={pothole:'POTHOLE: 1 — NIVA: 0',truck:'URAL SAYS NYET',pipe:'GOPNIK TOO TALL',gate:'CONCRETE SOCIALISM',double:'DOUBLE BLYAT'}[o&&o.type]||'TOO MUCH RUSSIA';
}

function update(dt){
  updateParticles(dt);shake=Math.max(0,shake-dt*2.8);flash=Math.max(0,flash-dt);car.impact=Math.max(0,car.impact-dt);zoneFlash=Math.max(0,zoneFlash-dt);startedHint=Math.max(0,startedHint-dt);
  if(state==='title')return;
  if(state==='gameover'){
    car.vy+=1000*dt;car.y+=car.vy*dt;car.pitch+=car.spin*dt;if(car.y>GROUND-46){car.y=GROUND-46;car.vy*=-.18;car.spin*=.68;}return;
  }
  elapsed+=dt;distance+=speed*dt/15;speed=Math.min(375,215+elapsed*4.6+score*1.05);
  car.vy+=1020*dt;car.y+=car.vy*dt;car.pitch+=((clamp(car.vy/620,-.42,.5))-car.pitch)*dt*5.2;
  if(car.y>GROUND-46){car.y=GROUND-46;if(car.vy>160){burst(CAR_X,GROUND-9,7,'#d8dde0',.4);car.impact=.12;}car.vy=0;car.pitch*=.7;}
  if(car.y<78){car.y=78;die({type:'pipe'});}

  spawnTimer-=dt;if(spawnTimer<=0){spawnObstacle();var density=Math.max(.95,1.7-score*.016);spawnTimer=density+rand(.14,.52);}
  for(var i=0;i<obstacles.length;i++){
    var o=obstacles[i];o.x-=speed*dt;
    if(!o.hit&&collides(o)){o.hit=true;die(o);break;}
    var passX=o.type==='double'?o.x+o.offset+30:o.x+o.w/2;
    if(!o.passed&&passX<CAR_X-86){o.passed=true;score++;tone(720,.055,.12,'square');if(score%5===0){zone=(zone+1)%4;zoneFlash=1.3;}}
  }
  obstacles=obstacles.filter(function(o){return o.x>-180;});
  tickAudio();
}

function background(){
  var palettes=[['#8a9aaa','#c6cdd1','#566067','#717d84'],['#8292a0','#bcc7cd','#4c565d','#667279'],['#798893','#b5c0c5','#454e54','#5f686e'],['#85929a','#c0c9cd','#535e65','#6e7980']];
  var p=palettes[zone];var g=ctx.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,p[0]);g.addColorStop(1,p[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,GROUND);
  var off=(distance*3.1)%220;
  ctx.fillStyle=p[2];
  for(var i=-2;i<7;i++){
    var x=i*220-off;
    if(zone===0){
      ctx.fillRect(x,170,168,160);
      for(var r=0;r<4;r++)for(var c=0;c<4;c++)rect(x+18+c*36,194+r*28,16,13,(r+c)%5===0?'#d5c887':'#4d5960');
      rect(x+112,190,40,120,'rgba(20,22,24,.12)');
      text('ПАНЕЛЬКА',x+84,178,10,'#c9d0d3','center');
    }
    else if(zone===1){ctx.beginPath();ctx.moveTo(x,335);ctx.lineTo(x+58,150);ctx.lineTo(x+116,335);ctx.fill();rect(x+55,300,7,40,p[2]);}
    else if(zone===2){rect(x,240,180,95,p[2]);rect(x+35,125,22,210,p[2]);rect(x+95,165,19,170,p[2]);ctx.fillStyle='rgba(72,80,84,.18)';ctx.beginPath();ctx.arc(x+45,115,35,0,Math.PI*2);ctx.fill();ctx.fillStyle=p[2];text('ДЫМ',x+92,250,12,'#cfd5d7','center');}
    else{ctx.fillRect(x+20,275,130,60);ctx.beginPath();ctx.moveTo(x+8,275);ctx.lineTo(x+85,220);ctx.lineTo(x+165,275);ctx.fill();rect(x+72,240,7,34,'#4a545a');}
  }
  for(var pole=-40;pole<W+80;pole+=190){rect(pole,150,3,184,'rgba(58,63,67,.35)');ctx.strokeStyle='rgba(58,63,67,.25)';ctx.beginPath();ctx.moveTo(pole,185);ctx.lineTo(pole+98,168);ctx.stroke();ctx.beginPath();ctx.moveTo(pole,215);ctx.lineTo(pole+92,201);ctx.stroke();}
  rect(0,332,W,106,'#edf2f4');ctx.fillStyle='#cbd3d8';for(var q=-20;q<W+20;q+=44){ctx.beginPath();ctx.arc(q,397,28,Math.PI,0);ctx.fill();}
  rect(46,286,120,62,'#61686e');rect(54,294,104,8,'#a93d36');text('ДОРОГ НЕТ',106,312,12,'#fff','center');text('но вы держитесь',106,326,9,'#dfe5e8','center');
  rect(0,GROUND,W,H-GROUND,'#4b5054');rect(0,GROUND,W,8,'#303437');var stripe=(distance*10)%128;for(var sx=-128;sx<W+128;sx+=128)rect(sx-stripe,493,74,5,'#7a7f82');rect(0,520,W,20,'#e8edf0');ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(0,0,W,GROUND);
}

function drawCar(){
  ctx.save();ctx.translate(CAR_X,car.y);ctx.rotate(car.pitch);var impact=Math.sin(car.impact*30)*car.impact*8;
  ctx.translate(0,impact);
  for(var j=0;j<2;j++){var wx=j?74:-62;ctx.fillStyle='#17191a';ctx.beginPath();ctx.arc(wx,38,26,0,Math.PI*2);ctx.fill();ctx.fillStyle='#777b7d';ctx.beginPath();ctx.arc(wx,38,11,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#d8d0c2';ctx.strokeStyle='#17191a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-110,22);ctx.lineTo(-100,-20);ctx.lineTo(-64,-54);ctx.lineTo(45,-54);ctx.lineTo(105,-18);ctx.lineTo(124,17);ctx.lineTo(119,31);ctx.closePath();ctx.fill();ctx.stroke();
  rect(-96,-10,18,9,'#8f4c34');rect(-12,7,22,8,'#6e4c2c');
  rect(-57,-46,47,29,'#44535c');rect(0,-46,42,29,'#44535c');ctx.strokeStyle='#17191a';ctx.strokeRect(-57,-46,47,29);ctx.strokeRect(0,-46,42,29);
  ctx.fillStyle='#8b5b3b';for(var i=0;i<12;i++)ctx.fillRect(-94+(i*29%185),-1+(i*13%28),3+(i%3),2);text('NIVA',-10,-3,15,'#343738','center');
  ctx.save();ctx.translate(-8,-86);if(car.hat){rect(-13,-58,26,9,'#111');rect(-9,-67,18,10,'#111');rect(-2,-64,4,4,'#d53a31');}
  ctx.fillStyle='#d4ad87';ctx.beginPath();ctx.arc(0,-39,10,0,Math.PI*2);ctx.fill();rect(8,-39,10,2,'#fff');rect(18,-40,10,1,'rgba(255,255,255,.5)');rect(-20,-29,40,39,'#101112');rect(-25,6,17,33,'#101112');rect(8,6,17,33,'#101112');
  rect(-17,-26,3,30,'#eee');rect(-9,-26,3,30,'#eee');rect(9,-26,3,30,'#eee');rect(17,-26,3,30,'#eee');
  ctx.restore();ctx.restore();
}

function drawObstacle(o){
  if(o.type==='pothole'){
    ctx.fillStyle='#1f2224';ctx.beginPath();ctx.ellipse(o.x,GROUND+11,60,15,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#101112';ctx.beginPath();ctx.ellipse(o.x,GROUND+12,40,9,0,0,Math.PI*2);ctx.fill();text('HOLE',o.x,GROUND-18,12,'#d8dde0','center');
  }else if(o.type==='truck'){
    rect(o.x-55,o.y,110,92,'#59634f');rect(o.x-40,o.y+10,48,36,'#37424a');rect(o.x+12,o.y+5,36,50,'#66705b');ctx.fillStyle='#161718';ctx.beginPath();ctx.arc(o.x-30,GROUND+2,18,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(o.x+35,GROUND+2,18,0,Math.PI*2);ctx.fill();text('URAL',o.x,o.y+55,13,'#ddd8c5','center');
  }else if(o.type==='pipe'){
    rect(o.x-52,0,104,o.h,'#656d71');rect(o.x-60,o.h-24,120,24,'#4d5458');rect(o.x-48,o.h-17,96,9,'#9a3d36');text('PIPE',o.x,o.h-58,13,'#e6e9ea','center');
  }else{
    var xs=[o.x-o.w/2];if(o.type==='double')xs.push(o.x-o.w/2+o.offset);
    for(var k=0;k<xs.length;k++){
      var shift=o.type==='double'&&k===1?Math.sin(o.x*.01)*32:0;var gt=clamp(o.gTop+shift,120,315),gb=clamp(o.gBottom+shift,245,410);var bw=o.type==='double'?44:o.w;
      rect(xs[k],0,bw,gt,'#6d7174');rect(xs[k],gb,bw,GROUND-gb+8,'#6d7174');
      rect(xs[k]+5,gt-18,bw-10,18,'#a13c35');rect(xs[k]+5,gb,bw-10,18,'#a13c35');
      ctx.strokeStyle='#414548';ctx.lineWidth=4;ctx.strokeRect(xs[k]+2,2,bw-4,gt-4);ctx.strokeRect(xs[k]+2,gb+2,bw-4,GROUND-gb+4);
    }
  }
}

function drawParticles(){for(var i=0;i<particles.length;i++){var p=particles[i];ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.c;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);}ctx.globalAlpha=1;}
function hud(){
  rect(18,18,275,80,'rgba(14,16,18,.88)');text('DISTANCE '+Math.floor(distance)+' m',32,28,24,'#fff');text('BEST '+best+' m',32,58,15,'#cfd4d7');
  text('BLYAT '+score,W/2,18,42,score?'#ef3d32':'#fff','center');text('BEST '+bestScore,W/2,66,14,'#d3d8db','center');
  if(startedHint>0&&state==='play'){ctx.globalAlpha=clamp(startedHint,0,1);text('TAP = PETIT VOL | LE 1er TROU EST PLUS FACILE',W/2,116,18,'#ffd34a','center');ctx.globalAlpha=1;}
  if(zoneFlash>0&&state==='play'){ctx.globalAlpha=clamp(zoneFlash,0,1);text(['PANELKA DOOMER','TAIGA DOOMER','INDUSTRIAL BLYAT','VILLAGE OF DESTINY'][zone],W-24,26,15,'#fff','right');ctx.globalAlpha=1;}
}
function title(){ctx.fillStyle='rgba(0,0,0,.52)';ctx.fillRect(0,0,W,H);text('NIVA BLYAT',W/2,102,72,'#ef3d32','center');text('DOOMER FLAPPY BUILD',W/2,188,24,'#ffd34a','center');text('PANELKA • GOPNIK • NEIGE SALE',W/2,220,14,'#d7dde0','center');text('TAP = LA NIVA VOLE',W/2,330,26,'#fff','center');text('Le 1er trou est plus easy. Évite le béton. Évite l’URAL.',W/2,376,16,'#fff','center');}
function gameover(){ctx.fillStyle='rgba(0,0,0,.68)';ctx.fillRect(0,0,W,H);text('BLYAT.',W/2,118,72,'#ef3d32','center');text(score+' PASSAGES',W/2,214,34,'#fff','center');text(deathText,W/2,276,17,'#ffd34a','center');text('TAP = ENCORE',W/2,372,28,'#fff','center');}

function render(){
  ctx.save();if(shake>0)ctx.translate(rand(-9,9)*shake,rand(-7,7)*shake);background();for(var i=0;i<obstacles.length;i++)drawObstacle(obstacles[i]);drawParticles();drawCar();hud();ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+clamp(flash*3,0,.5)+')';ctx.fillRect(0,0,W,H);}
  if(state==='title')title();if(state==='gameover')gameover();
}
function loop(ts){var dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);render();requestAnimationFrame(loop);}
render();requestAnimationFrame(loop);
window.addEventListener('pointerdown',function(e){e.preventDefault();tap();},{passive:false});
window.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();tap();}});
})();
</script>
</body>
</html>
