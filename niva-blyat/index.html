function drawGopnikPhotoV5(){
  var lean=clamp(car.vy/720,-.22,.26),squat=clamp(Math.abs(car.vy)/650,0,.35);
  ctx.save();ctx.translate(-12,-76+squat*6);ctx.rotate(lean*.4);
  ctx.fillStyle='#111315';ctx.beginPath();ctx.moveTo(-30,5);ctx.lineTo(-8,6);ctx.lineTo(-1,26);ctx.lineTo(-32,26);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(8,6);ctx.lineTo(30,5);ctx.lineTo(34,26);ctx.lineTo(2,26);ctx.closePath();ctx.fill();
  rr(-37,20,28,8,4,'#0c0e0f');rr(10,20,28,8,4,'#0c0e0f');rr(-20,-19,40,37,6,'#0d0f10');
  rect(-16,-17,3,30,'#e8e8e8');rect(-8,-17,3,30,'#e8e8e8');rect(8,-17,3,30,'#e8e8e8');rect(16,-17,3,30,'#e8e8e8');
  rect(-4,-27,9,9,'#c9946c');ctx.fillStyle='#d2a078';ctx.beginPath();ctx.arc(1,-36,11,0,Math.PI*2);ctx.fill();rr(-13,-50,28,9,2,'#111314');rr(-9,-59,20,11,2,'#111314');rect(-2,-56,5,5,'#c33e36');
  var armLift=clamp(-car.vy/520,0,.75);ctx.save();ctx.translate(-20,-8);ctx.rotate(-.2-armLift*.65);rr(-19,-3,25,8,4,'#101213');rect(-20,-1,7,5,'#d2a078');ctx.restore();ctx.save();ctx.translate(20,-8);ctx.rotate(.2+armLift*.65);rr(-5,-3,25,8,4,'#101213');rect(14,-1,7,5,'#d2a078');ctx.restore();
  line(10,-32,25,-29,'#e9e3d6',2);ctx.fillStyle='#d96a44';ctx.beginPath();ctx.arc(26,-29,2,0,Math.PI*2);ctx.fill();ctx.save();ctx.globalAlpha=.25;ctx.strokeStyle='#d9dfe1';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(28,-31);ctx.bezierCurveTo(34,-37,26,-42,34,-48);ctx.stroke();ctx.restore();ctx.restore();
}
drawCar=function(){
  var altitude=clamp((438-46-car.y)/180,0,1),compression=car.impact>0?Math.sin(car.impact*28)*car.impact*20:0;
  ctx.save();ctx.translate(250,car.y);ctx.rotate(car.pitch);ctx.translate(0,compression*.16);
  ctx.save();ctx.rotate(-car.pitch);ctx.globalAlpha=.30*(1-altitude*.6);ctx.fillStyle='#0b0d0f';ctx.beginPath();ctx.ellipse(0,57+altitude*5,110-altitude*22,13-altitude*3,0,0,Math.PI*2);ctx.fill();ctx.restore();ctx.globalAlpha=1;
  if(nivaPhoto.complete&&nivaPhoto.naturalWidth){ctx.drawImage(nivaPhoto,-124,-58,248,110);}else{rr(-110,-45,220,80,10,'#ad5a44','#111');}
  ctx.save();ctx.globalAlpha=.13;ctx.fillStyle='#3b342e';for(var g=0;g<11;g++){ctx.beginPath();ctx.ellipse(-88+g*17,18+(g%3)*7,7+(g%2)*3,2.5,0,0,Math.PI*2);ctx.fill();}ctx.restore();
  drawGopnikPhotoV5();ctx.restore();
};
